[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ufill"
version = "0.1.0"
description = "Satellite VCD gap-filling models and experiments"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "opencv-python",
    "Pillow",
    "netCDF4",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "joblib",
    "tensorboard",
    "tqdm",
]

[project.optional-dependencies]
lightgbm = ["lightgbm"]

[tool.setuptools.packages.find]
where = ["src"]
